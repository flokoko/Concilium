[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "concilium"
version = "0.1.0"
description = "Concilium — Multi-Agenten-Fonds-Entscheidungssystem (yfinance + LLM-Agenten, OpenAI-kompatibel), deutsche Reports."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
authors = [{name = "Florian K."}]
dependencies = [
    "yfinance>=1.4.0",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4", "matplotlib>=3.7"]

[project.scripts]
concilium = "concilium.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]